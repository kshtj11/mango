<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Screen 1: Lock -->
    <div id="lockscreen" class="screen">
      <div class="statusbar">
        <span>11 April &nbsp; 12:30</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="wifi"><span></span><span></span><span></span></div>
          <div class="battery">
            <div class="battery-body"><div class="battery-fill"></div></div>
            <div class="battery-tip"></div>
          </div>
        </div>
      </div>
      <div class="swipe-hint">Swipe up to go to homescreen</div>
    </div>

    <!-- Screen 2: Homepage / Dock -->
    <div id="homepage" class="screen">
      <div class="home-dock">
        <div class="app-icon"></div>
        <div class="app-icon"></div>
        <div class="app-icon"></div>
        <div class="app-icon"></div>
      </div>
      <div class="bottom-zone" id="home-bz"></div>
    </div>

    <!-- Screen 3: App List -->
    <div id="homescreen" class="screen">
      <div id="edge-zone"></div>
      <div class="top-dock">
        <div class="app-icon"></div>
        <div class="app-icon"></div>
        <div class="app-icon"></div>
        <div class="app-icon"></div>
      </div>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="7" cy="7" r="5.5" stroke="#555" stroke-width="1.5"/>
          <line x1="11" y1="11" x2="15" y2="15" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="grid-section">
        <div class="app-scroll" id="appScroll">
          <div class="app-grid" id="appGrid"></div>
        </div>
        <div class="scrollbar-track">
          <div class="scrollbar-thumb" id="scrollThumb"></div>
        </div>
      </div>
      <div class="bottom-zone" id="list-bz"></div>
    </div>

    <!-- Screen 4: Recent Apps -->
    <div id="recents" class="screen">
      <div class="recents-scroll" id="recentsScroll">
        <div class="app-card"></div>
        <div class="app-card"></div>
        <div class="app-card"></div>
        <div class="app-card"></div>
        <div class="app-card"></div>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
